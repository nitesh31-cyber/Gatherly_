name: OOP edition — build & run against a real database

on:
  push:
    paths:
      - 'oop-edition/**'
      - '.github/workflows/oop-build-and-test.yml'
  pull_request:
    paths:
      - 'oop-edition/**'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oop-edition

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_mgmt
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Load schema into MySQL
        run: mysql -h127.0.0.1 -uroot -proot event_mgmt < event_management.sql

      - name: Create a dedicated app DB user (never connect as root over JDBC)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE USER 'gatherly_app'@'%' IDENTIFIED WITH mysql_native_password BY 'GatherlyCI123!';
            GRANT ALL PRIVILEGES ON event_mgmt.* TO 'gatherly_app'@'%';
            FLUSH PRIVILEGES;"

      - name: Download MySQL Connector/J (needed at runtime, not compile time)
        run: |
          curl -fL -o mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar

      - name: Compile
        run: |
          mkdir -p out
          javac -d out $(find src -name "*.java")

      - name: Run against the real database
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/event_mgmt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: gatherly_app
          DB_PASS: GatherlyCI123!
        run: java -cp "out:mysql-connector-j.jar" com.gatherly.app.Main
